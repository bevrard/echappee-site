name: SEO checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'scripts/check-seo.py'
      - '.github/workflows/seo-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-seo.py
